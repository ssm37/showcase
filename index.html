<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A cinematic gallery of five selected projects.">
    <title>SSM37 — Selected Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: dark; --ink: #eeece8; --muted: #aba9ad; --line: rgba(255,255,255,.13); --page: #09090b; }
      * { box-sizing: border-box; } html { background: var(--page); }
      body { margin: 0; min-width: 320px; min-height: 100svh; overflow: hidden; background: radial-gradient(circle at 80% -10%, #1d1524 0, transparent 28rem), var(--page); color: var(--ink); font-family: Manrope, Arial, sans-serif; }
      body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .34; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px); background-size: 48px 48px; mask-image: linear-gradient(to bottom, black, transparent 85%); }
      .gallery { position: relative; isolation: isolate; width: 100%; height: 100svh; overflow: hidden; perspective: 1800px; }
      .gallery::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,.52) 100%); }
      .project { position: absolute; top: 50%; left: 50%; width: min(62vw, 720px); min-width: 280px; transform: translate3d(calc(-50% + var(--offset, 0px)), -50%, var(--depth, 0px)) rotateY(var(--rotation, 0deg)) scale(var(--scale, 1)); transform-style: preserve-3d; opacity: var(--opacity, 1); z-index: var(--layer, 1); filter: blur(var(--blur, 0)); transition: transform .72s cubic-bezier(.2,.75,.14,1), opacity .5s ease, filter .5s ease; will-change: transform; }
      .project { cursor: default; }.project:not(.is-active) .project__body { opacity: 0; transform: translateY(8px); }.project.is-active { isolation: isolate; }.project.is-active .project__link { background: #111216; opacity: 1; }.project.is-active .project__body { opacity: 1; transform: none; }.project__body { transition: opacity .4s ease, transform .4s ease; }
      .project__link { display: block; color: inherit; text-decoration: none; overflow: hidden; border: 1px solid var(--line); border-radius: 2px; background: rgba(255,255,255,.025); transform-style: preserve-3d; transition: border-color .3s ease, box-shadow .3s ease; }
      .project__link:hover { border-color: rgba(255,255,255,.48); box-shadow: 0 35px 80px rgba(0,0,0,.34); }.project:focus-visible .project__link { outline: 3px solid #f6d7ff; outline-offset: 5px; }
      .project__preview { position: relative; height: clamp(250px, 34vw, 540px); isolation: isolate; overflow: hidden; background: #1b1c22; }.project__preview::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(120deg, var(--tone-a), var(--tone-b)); transition: transform .8s cubic-bezier(.2,.7,.2,1); }.project__link:hover .project__preview::before { transform: scale(1.12); }
      .project__orb { position: absolute; border-radius: 50%; filter: blur(2px); mix-blend-mode: screen; transition: transform .7s cubic-bezier(.2,.7,.2,1); }.project__orb--one { width: 54%; aspect-ratio: 1; top: -18%; left: -10%; background: radial-gradient(circle at 36% 34%, #fff8, var(--orb-a) 19%, transparent 66%); }.project__orb--two { width: 65%; aspect-ratio: 1; right: -20%; bottom: -38%; background: radial-gradient(circle, var(--orb-b), transparent 64%); }.project__link:hover .project__orb--one { transform: translate(9%, 11%) scale(1.08); }.project__link:hover .project__orb--two { transform: translate(-12%, -10%) scale(1.1); }
      .project__geometry { position: absolute; inset: 13%; border: 1px solid rgba(255,255,255,.24); transform: rotate(-19deg); background: repeating-linear-gradient(90deg, transparent 0 24px, rgba(255,255,255,.12) 25px 26px); box-shadow: 0 0 70px var(--orb-a); transition: transform .8s cubic-bezier(.2,.7,.2,1); }.project__link:hover .project__geometry { transform: rotate(-9deg) scale(1.08); }
      .project__grain { position: absolute; inset: 0; z-index: 2; opacity: .2; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E"); mix-blend-mode: overlay; pointer-events: none; }
      .project__preview-label, .project__index { position: absolute; z-index: 3; font: 500 10px/1.2 'DM Mono', monospace; letter-spacing: .11em; text-transform: uppercase; }.project__preview-label { left: 1.1rem; bottom: 1rem; color: rgba(255,255,255,.72); }.project__index { right: 1.1rem; top: 1rem; font-size: 1.1rem; color: rgba(255,255,255,.88); }
      .project__body { padding: clamp(1.1rem, 2vw, 1.8rem); min-height: 172px; display: grid; align-content: start; gap: .85rem; background: linear-gradient(100deg, rgba(255,255,255,.055), transparent); }.project__meta { display: flex; align-items: center; justify-content: space-between; font: 500 10px/1 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }.project__arrow { display: inline-flex; align-items: center; height: 39px; gap: .42rem; padding: 0 16px; border: 0; border-radius: 4px; color: #111; background: #fff; font: 600 13px/1 Manrope, Arial, sans-serif; letter-spacing: 0; text-decoration: none; text-transform: none; transition: transform .25s ease, background .25s ease; }.project__arrow:hover { background: #e5e5e5; transform: translate(3px,-3px); }.project__arrow:focus-visible { outline: 2px solid #f6d7ff; outline-offset: 4px; }.project:not(.is-active) .project__arrow { pointer-events: none; }
      h2, p { margin: 0; } h2 { font-size: clamp(1.45rem, 2.55vw, 3.15rem); line-height: 1.06; letter-spacing: -.06em; font-weight: 700; max-width: 12ch; } p { color: var(--muted); font-size: .78rem; line-height: 1.5; max-width: 32ch; }.project__tags { margin: .1rem 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: .4rem; }.project__tags li { border: 1px solid var(--line); padding: .35rem .48rem; color: #c2c0c5; font: 400 9px/1 'DM Mono', monospace; letter-spacing: .07em; text-transform: uppercase; }
      .project--market { --tone-a: #072831; --tone-b: #06463d; --orb-a: #38ffc1; --orb-b: #90eeff; }.project--zero { --tone-a: #1d1137; --tone-b: #100d29; --orb-a: #e96dff; --orb-b: #5c61ff; }.project--baklava { --tone-a: #3a1807; --tone-b: #801e15; --orb-a: #ffc361; --orb-b: #ff5367; }.project--drebov-one { --tone-a: #15221c; --tone-b: #102d31; --orb-a: #a8ff8d; --orb-b: #53d6ee; }.project--drebov-two { --tone-a: #271319; --tone-b: #38101f; --orb-a: #fd7998; --orb-b: #ffdf88; }
      .carousel-controls { position: fixed; z-index: 20; left: 50%; bottom: clamp(1rem, 4vh, 2.5rem); transform: translateX(-50%); display: flex; align-items: center; gap: .85rem; font: 500 10px/1 'DM Mono', monospace; letter-spacing: .16em; color: var(--muted); }
      .carousel-button { width: 2.4rem; height: 2.4rem; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: rgba(12,12,15,.65); color: var(--ink); cursor: pointer; font-size: 1.2rem; transition: background .2s, transform .2s, border-color .2s; }.carousel-button:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.45); transform: scale(1.08); }.carousel-button:focus-visible { outline: 2px solid #f6d7ff; outline-offset: 3px; }.carousel-count { min-width: 4.5rem; text-align: center; }
      @media (max-width: 720px) { .project { width: min(84vw, 480px); min-width: 0; }.project__preview { height: min(76vw, 400px); }.project__body { min-height: 160px; }.project:not(.is-active) .project__body { opacity: 0; }.project__preview-label { font-size: 8px; }.carousel-controls { bottom: 1rem; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <main class="gallery" data-gallery aria-label="Selected projects"></main>
    <div class="carousel-controls" aria-label="Project carousel controls">
      <button class="carousel-button" type="button" data-previous aria-label="Previous project">←</button>
      <output class="carousel-count" data-count aria-live="polite"></output>
      <button class="carousel-button" type="button" data-next aria-label="Next project">→</button>
    </div>
    <script>
      const projects = [
        { title: 'Crypto Market Floor', url: 'https://crypto.repo4.net', status: 'External site', description: 'Description pending verification.', stack: ['Stack unverified'], theme: 'market', number: '01' },
        { title: 'OneZero', url: 'https://onezero.repo4.net', status: 'External site', description: 'Description pending verification.', stack: ['Stack unverified'], theme: 'zero', number: '02' },
        { title: 'Mevrouw Baklava', url: 'https://mevrouw-baklava.repo4.net', status: 'External site', description: 'Description pending verification.', stack: ['Stack unverified'], theme: 'baklava', number: '03' },
        { title: 'Max Drebov — Concept 1', url: 'https://max-drebov.repo4.net', status: 'Concept', description: 'Description pending verification.', stack: ['Stack unverified'], theme: 'drebov-one', number: '04' },
        { title: 'Max Drebov — Concept 2', url: 'https://max-drebov-2.repo4.net', status: 'Concept', description: 'Description pending verification.', stack: ['Stack unverified'], theme: 'drebov-two', number: '05' }
      ];
      const gallery = document.querySelector('[data-gallery]');
      const count = document.querySelector('[data-count]');
      gallery.innerHTML = projects.map((project) => `
        <article class="project project--${project.theme}" data-project tabindex="0" aria-label="${project.title}">
          <div class="project__link">
            <div class="project__preview" aria-hidden="true"><div class="project__grain"></div><div class="project__orb project__orb--one"></div><div class="project__orb project__orb--two"></div><div class="project__geometry"></div><span class="project__preview-label">Visual placeholder · screenshot pending</span><span class="project__index">${project.number}</span></div>
            <div class="project__body"><div class="project__meta"><span>${project.status}</span><a class="project__arrow" data-visit href="${project.url}" target="_blank" rel="noopener noreferrer" aria-label="Visit ${project.title} in a new tab">Visit website <span aria-hidden="true">↗</span></a></div><h2>${project.title}</h2><p>${project.description}</p><ul class="project__tags" aria-label="Technology stack">${project.stack.map((item) => `<li>${item}</li>`).join('')}</ul></div>
          </div>
        </article>`).join('');
      let activeIndex = 2;
      const cards = [...document.querySelectorAll('[data-project]')];
      const cardCount = cards.length;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const getRelativePosition = (index) => {
        let difference = index - activeIndex;
        if (difference > cardCount / 2) difference -= cardCount;
        if (difference < -cardCount / 2) difference += cardCount;
        return difference;
      };
      const updateCarousel = () => {
        cards.forEach((card, index) => {
          const position = getRelativePosition(index);
          const distance = Math.abs(position);
          card.classList.toggle('is-active', position === 0);
          const direction = Math.sign(position);
          const stackOffset = (window.innerWidth < 720 ? 20 : 18) + Math.max(0, distance - 1) * 8;
          card.style.setProperty('--offset', `${direction * stackOffset}vw`);
          card.style.setProperty('--depth', `${-distance * 190}px`);
          card.style.setProperty('--rotation', `${position * -22}deg`);
          card.style.setProperty('--scale', `${1 - distance * .12}`);
          card.style.setProperty('--opacity', `${position === 0 ? 1 : 1 - distance * .07}`);
          card.style.setProperty('--blur', `${distance * .55}px`);
          card.style.setProperty('--layer', `${10 - distance}`);
          card.setAttribute('aria-current', position === 0 ? 'true' : 'false');
          card.querySelector('[data-visit]').tabIndex = position === 0 ? 0 : -1;
        });
        count.textContent = `${String(activeIndex + 1).padStart(2, '0')} / ${String(cardCount).padStart(2, '0')}`;
      };
      const step = (amount) => {
        if (!amount) return;
        activeIndex = (activeIndex + amount + cardCount) % cardCount;
        updateCarousel();
      };
      const select = (index) => {
        activeIndex = (index + cardCount) % cardCount;
        updateCarousel();
      };
      cards.forEach((card, index) => {
        card.addEventListener('click', (event) => {
          if (event.target.closest('[data-visit]')) return;
          if (index !== activeIndex) select(index);
        });
        card.addEventListener('keydown', (event) => {
          if ((event.key === 'Enter' || event.key === ' ') && index !== activeIndex) { event.preventDefault(); select(index); }
        });
      });
      document.querySelector('[data-previous]').addEventListener('click', () => step(-1));
      document.querySelector('[data-next]').addEventListener('click', () => step(1));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') { event.preventDefault(); step(-1); }
        if (event.key === 'ArrowRight') { event.preventDefault(); step(1); }
      });
      let lastWheel = 0;
      gallery.addEventListener('wheel', (event) => {
        if (Math.abs(event.deltaX) + Math.abs(event.deltaY) < 15 || Date.now() - lastWheel < 450) return;
        lastWheel = Date.now();
        event.preventDefault();
        step((Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY) > 0 ? 1 : -1);
      }, { passive: false });
      let touchStartX = 0;
      gallery.addEventListener('touchstart', (event) => { touchStartX = event.changedTouches[0].screenX; }, { passive: true });
      gallery.addEventListener('touchend', (event) => {
        const movement = event.changedTouches[0].screenX - touchStartX;
        if (Math.abs(movement) > 40) step(movement < 0 ? 1 : -1);
      }, { passive: true });
      window.addEventListener('resize', updateCarousel);
      updateCarousel();
    </script>
  </body>
</html>
